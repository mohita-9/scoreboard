<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07060c">
<title>My matches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --magenta: #dd0e23; --magenta-dim: rgba(221,14,35,0.15); --magenta-glow: rgba(221,14,35,0.35);
  --cyan: #0b49d3; --cyan-dim: rgba(11,73,211,0.12); --cyan-glow: rgba(11,73,211,0.35);
  --bg: #0a0008; --card: rgba(5,0,10,0.60);
  --text: #f0f2f5; --text-sub: #7a8494; --text-muted: #3a4250;
  --border: rgba(11,73,211,0.12); --border-hi: rgba(11,73,211,0.28);
  --ok: #19c37d; --warn: #f5a623; --bad: #ff3b4e;
}
html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh; color: var(--text); font-family: "Inter", system-ui, sans-serif; font-size: 15px;
  background-color: #07060c;
  background-image:
    radial-gradient(ellipse 80% 80% at -5% 100%, var(--magenta-glow) 0%, transparent 65%),
    radial-gradient(ellipse 70% 90% at 105% 50%, var(--cyan-glow) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 50% 50%, rgba(30,10,50,0.5) 0%, transparent 80%);
  background-attachment: fixed;
}
.cond { font-family: "Barlow Condensed", sans-serif; letter-spacing: 0.04em; text-transform: uppercase; }
.brandbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); position: relative; }
.brandbar::after { content: ""; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 120px; height: 2px;
  background: linear-gradient(90deg, var(--magenta), var(--cyan)); border-radius: 2px; }
.brandbar img { height: 40px; width: auto; object-fit: contain; }
.brandbar img[src=""] { display: none; }
.brand-name { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 0.05em; text-transform: uppercase;
  background: linear-gradient(90deg, var(--magenta) 0%, #a030a0 45%, var(--cyan) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
.brand-sub { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-sub); margin-top: 3px; }
.brandbar .spacer { flex: 1; }
.card { background: var(--card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1); border-top-color: var(--border-hi); border-radius: 14px; padding: 16px; }
.btn { appearance: none; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: var(--text);
  font: 600 15px "Inter", sans-serif; padding: 12px 16px; border-radius: 10px; cursor: pointer; min-height: 44px; }
.btn:hover { background: rgba(255,255,255,0.1); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: linear-gradient(90deg, var(--magenta), var(--cyan)); border-color: transparent; color: #fff; }
.btn.red { background: var(--magenta); border-color: var(--magenta); color: #fff; }
.btn.blue { background: var(--cyan); border-color: var(--cyan); color: #fff; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 32px; padding: 6px 10px; font-size: 13px; }
input, select, textarea { font: 15px "Inter", sans-serif; color: var(--text); background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.16); border-radius: 10px; padding: 11px 12px; width: 100%; min-height: 44px; }
select option { background: #111; }
label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-sub); margin: 12px 0 6px; }
.muted { color: var(--text-sub); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 20px; border: 1px solid var(--text-muted); color: var(--text-sub); white-space: nowrap; }
.pill.live { border-color: var(--magenta); color: #fff; background: var(--magenta-dim); }
.pill.done { border-color: var(--cyan); color: #cfe0ff; background: var(--cyan-dim); }
.pill.golden { border-color: #ffd34d; color: #ffd34d; background: rgba(255,211,77,0.12); }
.pill.stale { border-color: var(--bad); color: #fff; background: var(--bad); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.live .dot { animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #15121e; border: 1px solid var(--border-hi);
  padding: 12px 18px; border-radius: 12px; z-index: 50; max-width: 92vw; box-shadow: 0 10px 40px rgba(0,0,0,.5); display: none; }
.toast.show { display: block; }
.toast.err { border-color: var(--bad); }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
.modal-bg.show { display: flex; }
.modal { width: 100%; max-width: 520px; max-height: 90vh; overflow: auto; }
.modal h3 { font-family: "Barlow Condensed", sans-serif; font-size: 26px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.row { display: flex; gap: 10px; align-items: center; }
.row > * { flex: 1; }
.hidden { display: none !important; }
.err-text { color: #ff8a95; font-size: 14px; margin-top: 10px; min-height: 18px; white-space: pre-line; }

main { max-width: 620px; margin: 0 auto; padding: 14px 14px 60px; }
.picker { display: flex; gap: 8px; margin-top: 14px; }
.picker input { flex: 1; }
.teamname { font-family: "Barlow Condensed", sans-serif; font-size: 40px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; line-height: 1; margin: 18px 0 4px; word-break: break-word; }
h2.sec { font-family: "Barlow Condensed", sans-serif; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-sub);
  margin: 20px 0 8px; display: flex; align-items: center; gap: 10px; }
h2.sec::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-hi), transparent); }
.big { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.big .t { font-size: 18px; font-weight: 600; word-break: break-word; }
.big .t.me { color: #fff; } .big .t.opp { color: var(--text-sub); }
.big .p { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 56px; line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.fact { flex: 1 1 120px; background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 10px; }
.fact .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-sub); }
.fact .v { font-family: "Barlow Condensed", sans-serif; font-size: 28px; font-weight: 700; margin-top: 2px; }
.res { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
.res:last-child { border-bottom: none; }
.wl { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 20px; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.wl.w { background: var(--cyan); } .wl.l { background: var(--magenta); }
.res .info { flex: 1; min-width: 0; } .res .info .o { font-weight: 600; } .res .info .s { font-size: 13px; color: var(--text-sub); }
table.st { width: 100%; border-collapse: collapse; }
table.st th { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-sub); text-align: center; padding: 0 4px 6px; }
table.st th:nth-child(2) { text-align: left; }
table.st td { padding: 9px 4px; text-align: center; border-top: 1px solid rgba(255,255,255,.06); font-variant-numeric: tabular-nums; }
table.st td:nth-child(2) { text-align: left; }
table.st tr.me td { background: var(--magenta-dim); font-weight: 700; }
table.st td.pts { font-family: "Barlow Condensed", sans-serif; font-size: 22px; font-weight: 700; }
.updated { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 24px; }
</style>
</head>
<body data-page="My matches">
<header class="brandbar">
  <img data-brand="logo" src="" alt="">
  <div><div class="brand-name" data-brand="name">League</div><div class="brand-sub" data-brand="sub"></div></div>
</header>
<main>
  <div class="picker">
    <input id="team-in" list="team-list" placeholder="Search your team…" autocomplete="off">
    <datalist id="team-list"></datalist>
    <button class="btn primary" id="btn-go">Show</button>
  </div>
  <div id="content"><div class="card" style="margin-top:16px">Pick your team to see your next match, live score and group standing.</div></div>
  <div class="updated" id="updated"></div>
</main>
<div class="toast" id="toast"></div>

<script>
// ===== CONFIGURE: your Apps Script web app URL (ends in /exec) =====
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyzWa-NLXqSl6u-3Q_Je9yFCAkufBykJSl0xo5T_7sLRY2hPWF43QOKyg3S-pN8GoONeQ/exec";
// ==================================================================

/* ==== SHARED SCORING RULES (identical copy on server and every page) ==== */
var Rules = (function () {
  // stageRule: { stage, setsToWin, target, cap, deciderTarget, deciderCap }
  function maxSets(rule) { return rule.setsToWin * 2 - 1; }

  function setLimits(rule, setNo) { // setNo is 1-based
    var isDecider = rule.setsToWin > 1 && setNo === maxSets(rule);
    return isDecider ? { T: rule.deciderTarget, C: rule.deciderCap, decider: true }
                     : { T: rule.target, C: rule.cap, decider: false };
  }

  function isComplete(a, b, T, C) {
    var m = Math.max(a, b);
    return m === C || (m >= T && Math.abs(a - b) >= 2);
  }

  // Status of a single set score under target T / cap C.
  function setStatus(a, b, T, C) {
    var bad = { valid: false, complete: false, winner: null, golden: false };
    if (!isInt(a) || !isInt(b) || a < 0 || b < 0 || a > C || b > C) return bad;
    if (isComplete(a, b, T, C)) {
      if (a === b) return bad;
      var W = Math.max(a, b), L = Math.min(a, b);
      if (isComplete(W - 1, L, T, C)) return bad; // set would already have ended earlier
      return { valid: true, complete: true, winner: a > b ? 'A' : 'B', golden: false };
    }
    return { valid: true, complete: false, winner: null, golden: a === b && a === C - 1 };
  }

  // sets: [[a,b],[a,b],[a,b]] (missing entries treated as 0-0)
  function matchStatus(rule, sets) {
    var n = maxSets(rule), setsA = 0, setsB = 0, winner = null, current = null;
    var per = [];
    for (var i = 0; i < 3; i++) {
      var s = sets[i] || [0, 0], a = Number(s[0]) || 0, b = Number(s[1]) || 0;
      var played = a > 0 || b > 0;
      if (i >= n) {
        if (played) return fail('Set ' + (i + 1) + ' is not used in ' + rule.stage);
        continue;
      }
      var lim = setLimits(rule, i + 1);
      var st = setStatus(a, b, lim.T, lim.C);
      if (!st.valid) return fail('Set ' + (i + 1) + ' score ' + a + '-' + b + ' is not possible (to ' + lim.T + ', cap ' + lim.C + ')');
      if (winner && played) return fail('Set ' + (i + 1) + ' played after the match was decided');
      if (current !== null && played) return fail('Set ' + (i + 1) + ' started before set ' + (current + 1) + ' finished');
      per.push({ a: a, b: b, T: lim.T, C: lim.C, decider: lim.decider, complete: st.complete, winner: st.winner, golden: st.golden });
      if (winner) continue;
      if (st.complete) {
        if (st.winner === 'A') setsA++; else setsB++;
        if (setsA === rule.setsToWin) winner = 'A';
        else if (setsB === rule.setsToWin) winner = 'B';
      } else if (current === null) {
        current = i;
      }
    }
    if (winner) current = lastPlayed(per);
    return { valid: true, error: null, setsA: setsA, setsB: setsB, decided: !!winner, winner: winner,
             currentSet: current === null ? 0 : current, sets: per };
  }

  function lastPlayed(per) {
    for (var i = per.length - 1; i >= 0; i--) if (per[i].a > 0 || per[i].b > 0) return i;
    return 0;
  }
  function fail(msg) { return { valid: false, error: msg }; }
  function isInt(x) { return typeof x === 'number' && isFinite(x) && Math.floor(x) === x; }

  function describe(rule, setNo) {
    var lim = setLimits(rule, setNo);
    var txt = 'To ' + lim.T + (lim.C > lim.T + 1 ? ', win by 2, cap ' + lim.C : ', win by 2') +
              ', golden point at ' + (lim.C - 1) + '-' + (lim.C - 1);
    return (rule.setsToWin > 1 ? 'Best of 3. ' : 'Single game. ') + txt;
  }

  return { maxSets: maxSets, setLimits: setLimits, isComplete: isComplete, setStatus: setStatus,
           matchStatus: matchStatus, describe: describe };
})();
/* ==== END SHARED SCORING RULES ==== */

/* ==== COMMON CLIENT HELPERS ==== */
function esc(v) {
  return String(v === undefined || v === null ? '' : v).replace(/[&<>"'`]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c];
  });
}
function $(sel, root) { return (root || document).querySelector(sel); }
function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

var Api = {
  base: function () { return String(APPS_SCRIPT_URL).split('?')[0]; },
  get: function (params) {
    var q = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
    return fetch(Api.base() + '?' + q + '&t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  },
  // text/plain keeps this a "simple" request: no CORS preflight to Apps Script
  post: function (body) {
    return fetch(Api.base(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); },
            function (e) { var x = new Error('Network error'); x.network = true; throw x; });
  }
};

function store(key, val) {
  try { if (val === undefined) return JSON.parse(localStorage.getItem(key) || 'null'); localStorage.setItem(key, JSON.stringify(val)); }
  catch (e) { return null; }
}

// League config: stage rules + branding. Cached so pages still open offline.
function loadConfig() {
  return Api.get({ view: 'config' }).then(function (cfg) {
    if (!cfg || !cfg.stages) throw new Error('bad config');
    store('league_cfg', cfg); applyBranding(cfg); return cfg;
  }).catch(function (e) {
    var c = store('league_cfg'); if (c) { applyBranding(c); return c; } throw e;
  });
}

function hexToRgba(hex, a) {
  var m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim()); if (!m) return null;
  var n = parseInt(m[1], 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
}

function applyBranding(cfg) {
  var b = (cfg && cfg.branding) || {}, root = document.documentElement.style;
  if (b.LEAGUE_NAME) {
    $all('[data-brand="name"]').forEach(function (n) { n.textContent = b.LEAGUE_NAME; });
    document.title = b.LEAGUE_NAME + ' — ' + (document.body.getAttribute('data-page') || '');
  }
  $all('[data-brand="sub"]').forEach(function (n) { n.textContent = b.LEAGUE_SUBTITLE || ''; });
  $all('[data-brand="logo"]').forEach(function (n) { if (b.LOGO_URL) { n.src = b.LOGO_URL; n.alt = b.LEAGUE_NAME || ''; } });
  $all('[data-brand="sponsor"]').forEach(function (n) { if (b.SPONSOR_LOGO_URL) n.src = b.SPONSOR_LOGO_URL; });
  [['COLOR_PRIMARY', 'magenta'], ['COLOR_SECONDARY', 'cyan']].forEach(function (p) {
    var hex = b[p[0]]; if (!hexToRgba(hex, 1)) return;
    root.setProperty('--' + p[1], hex);
    root.setProperty('--' + p[1] + '-dim', hexToRgba(hex, p[1] === 'cyan' ? 0.12 : 0.15));
    root.setProperty('--' + p[1] + '-glow', hexToRgba(hex, 0.35));
    if (p[1] === 'cyan') { root.setProperty('--border', hexToRgba(hex, 0.12)); root.setProperty('--border-hi', hexToRgba(hex, 0.28)); }
  });
}

function setsOf(m) { return [[+m.S1A || 0, +m.S1B || 0], [+m.S2A || 0, +m.S2B || 0], [+m.S3A || 0, +m.S3B || 0]]; }

function relTime(iso) {
  if (!iso) return '—';
  var s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  return Math.floor(s / 3600) + 'h ago';
}

var toastTimer;
function toast(msg, isErr) {
  var t = $('#toast'); if (!t) return;
  t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = 'toast'; }, isErr ? 6000 : 2500);
}

function byQueue(a, b) { return (+a['Queue Order'] || 0) - (+b['Queue Order'] || 0) || String(a['Match ID']).localeCompare(String(b['Match ID']), undefined, { numeric: true }); }

// Score text for a match: completed sets plus the current set.
function scoreLine(m, rule) {
  var sets = setsOf(m), n = rule ? Rules.maxSets(rule) : 3, parts = [];
  for (var i = 0; i < n; i++) if (sets[i][0] || sets[i][1] || i === 0) parts.push(sets[i][0] + '–' + sets[i][1]);
  return parts.join(', ');
}
// Repeat fn every ms, but skip while the page is in the background (saves server load), and run at once on return.
function every(ms, fn) {
  var t = setInterval(function () { if (!document.hidden) fn(); }, ms);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) fn(); });
  return t;
}
/* ==== END COMMON CLIENT HELPERS ==== */


var P = { cfg: null, matches: [], standings: [], team: null };

function teamNames() {
  var set = {};
  P.standings.forEach(function (r) { if (r['Team Name']) set[r['Team Name']] = 1; });
  // knockout placeholders like "G1 1st" or "PQ1 Winner" are not teams, so only fall back to match names if there is no group table
  if (!P.standings.length) P.matches.forEach(function (m) { if (m['Team A']) set[m['Team A']] = 1; if (m['Team B']) set[m['Team B']] = 1; });
  return Object.keys(set).sort(function (a, b) { return a.localeCompare(b); });
}

function choose(name) {
  name = String(name || '').trim(); if (!name) return;
  var match = teamNames().filter(function (n) { return n.toLowerCase() === name.toLowerCase(); })[0];
  if (!match && P.matches.length) { toast('No team called "' + name + '"', true); return; }
  P.team = match || name; store('player_team', P.team);
  $('#team-in').value = P.team;
  var url = new URL(location.href); url.searchParams.set('team', P.team); history.replaceState(null, '', url);
  render();
}
$('#btn-go').onclick = function () { choose($('#team-in').value); };
$('#team-in').onkeydown = function (e) { if (e.key === 'Enter') choose(this.value); };
$('#team-in').onchange = function () { if (teamNames().indexOf(this.value) >= 0) choose(this.value); };

function mine(m) { var t = P.team.toLowerCase(); return String(m['Team A']).toLowerCase() === t || String(m['Team B']).toLowerCase() === t; }
function isA(m) { return String(m['Team A']).toLowerCase() === P.team.toLowerCase(); }

function render() {
  $('#team-list').innerHTML = teamNames().map(function (n) { return '<option value="' + esc(n) + '">'; }).join('');
  if (!P.team) return;
  var my = P.matches.filter(mine).sort(byQueue);
  var live = my.filter(function (m) { return m.Status === 'Live'; })[0];
  var next = my.filter(function (m) { return m.Status === 'Scheduled'; });
  var done = my.filter(function (m) { return m.Status === 'Done'; });
  var html = '<div class="teamname">' + esc(P.team) + '</div>';

  if (live) {
    var rule = P.cfg.stages[live.Stage], ms = Rules.matchStatus(rule, setsOf(live)), cs = setsOf(live)[ms.valid ? ms.currentSet : 0];
    var meA = isA(live), myPts = meA ? cs[0] : cs[1], opPts = meA ? cs[1] : cs[0];
    html += '<h2 class="sec"><span class="pill live"><span class="dot"></span>Live now</span></h2><div class="card">' +
      '<div class="big"><div class="t me">' + esc(P.team) + '</div><div class="p" style="color:var(--magenta)">' + myPts + '</div>' +
      '<div class="t opp">' + esc(meA ? live['Team B'] : live['Team A']) + '</div><div class="p" style="color:var(--cyan)">' + opPts + '</div></div>' +
      '<div class="facts"><div class="fact"><div class="k">Court</div><div class="v">' + esc(live.Court) + '</div></div>' +
      '<div class="fact"><div class="k">Stage</div><div class="v" style="font-size:20px">' + esc(live.Stage) + '</div></div>' +
      (rule.setsToWin > 1 && ms.valid ? '<div class="fact"><div class="k">Sets</div><div class="v">' + (meA ? ms.setsA + '–' + ms.setsB : ms.setsB + '–' + ms.setsA) + '</div></div>' : '') +
      '</div></div>';
  }

  html += '<h2 class="sec">Next match</h2>';
  if (next.length) {
    var n = next[0];
    var ahead = P.matches.filter(function (m) {
      return String(m.Court) === String(n.Court) && m['Match ID'] !== n['Match ID'] &&
        (m.Status === 'Live' || (m.Status === 'Scheduled' && byQueue(m, n) < 0));
    }).length;
    html += '<div class="card"><div class="muted" style="font-size:13px">' + esc(n.Stage) + (n.Group ? ' · Group ' + esc(n.Group) : '') + ' · ' + esc(n['Match ID']) + '</div>' +
      '<div style="font-size:22px;font-weight:700;margin-top:6px">vs ' + esc(isA(n) ? n['Team B'] : n['Team A']) + '</div>' +
      '<div class="facts"><div class="fact"><div class="k">Court</div><div class="v">' + esc(n.Court) + '</div></div>' +
      '<div class="fact"><div class="k">Matches ahead</div><div class="v">' + ahead + '</div></div></div>' +
      (ahead === 0 && !live ? '<div style="margin-top:10px;color:var(--ok);font-weight:600">You are up next — head to court ' + esc(n.Court) + '.</div>' : '') +
      (next.length > 1 ? '<div class="muted" style="margin-top:10px;font-size:13px">Later: ' + next.slice(1).map(function (m) { return 'vs ' + esc(isA(m) ? m['Team B'] : m['Team A']) + ' (court ' + esc(m.Court) + ')'; }).join(' · ') + '</div>' : '') +
      '</div>';
  } else html += '<div class="card muted">' + (live ? 'Nothing else scheduled yet.' : 'No upcoming match scheduled yet.') + '</div>';

  html += '<h2 class="sec">Results</h2><div class="card">';
  if (done.length) html += done.reverse().map(function (m) {
    var won = String(m.Winner).toLowerCase() === P.team.toLowerCase(), rule = P.cfg.stages[m.Stage];
    var sets = setsOf(m).filter(function (s, i) { return i === 0 || s[0] || s[1]; }).map(function (s) { return isA(m) ? s[0] + '–' + s[1] : s[1] + '–' + s[0]; });
    return '<div class="res"><div class="wl ' + (won ? 'w' : 'l') + '">' + (won ? 'W' : 'L') + '</div><div class="info"><div class="o">vs ' + esc(isA(m) ? m['Team B'] : m['Team A']) +
      '</div><div class="s">' + esc(m.Stage) + ' · ' + esc(sets.join(', ')) + '</div></div></div>';
  }).join('');
  else html += '<div class="muted">No completed matches yet.</div>';
  html += '</div>';

  var me = P.standings.filter(function (r) { return String(r['Team Name']).toLowerCase() === P.team.toLowerCase(); })[0];
  if (me) {
    var grp = P.standings.filter(function (r) { return r['Group Name'] === me['Group Name']; })
      .sort(function (a, b) { return (+b['Total Points'] || 0) - (+a['Total Points'] || 0); });
    var rank = grp.indexOf(me) + 1;
    html += '<h2 class="sec">Group ' + esc(me['Group Name']) + ' · you are #' + rank + '</h2><div class="card"><table class="st"><thead><tr><th></th><th>Team</th><th>MP</th><th>W</th><th>L</th><th>Pts</th></tr></thead><tbody>' +
      grp.map(function (r, i) {
        return '<tr class="' + (r === me ? 'me' : '') + '"><td>' + (i + 1) + '</td><td>' + esc(r['Team Name']) + '</td><td>' + esc(r['Total Matches']) + '</td><td>' + esc(r['Matches Won']) +
          '</td><td>' + esc(r['Matches Lost']) + '</td><td class="pts">' + esc(r['Total Points']) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  $('#content').innerHTML = html;
}

// One request per refresh. Each phone waits a little longer when the server is struggling (up to 1 minute),
// and phones are spread out in time so they don't all ask at the same second.
var failures = 0;
function refresh() {
  return Api.get({ view: 'public' }).then(function (r) {
    if (!r || !Array.isArray(r.matches)) throw new Error('bad');
    P.matches = r.matches; P.standings = r.standings || []; failures = 0;
    $('#updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    render();
  }).catch(function () { failures++; $('#updated').textContent = 'Busy — retrying…'; });
}
function schedule() {
  var base = (P.cfg.settings.PLAYER_POLL_MS) || 15000;
  var wait = Math.min(60000, base * Math.pow(2, Math.min(failures, 2))) * (0.8 + Math.random() * 0.4);
  setTimeout(function () { (document.hidden ? Promise.resolve() : refresh()).then(schedule); }, wait);
}
document.addEventListener('visibilitychange', function () { if (!document.hidden && P.cfg) refresh(); });

loadConfig().then(function (cfg) {
  P.cfg = cfg;
  var q = new URLSearchParams(location.search).get('team');
  P.team = q || store('player_team');
  if (P.team) $('#team-in').value = P.team;
  return refresh();
}).then(function () {
  if (P.team) choose(P.team);
  schedule();
}).catch(function () {
  $('#content').innerHTML = '<div class="card" style="margin-top:16px">Cannot reach the league server right now. Please try again in a moment.</div>';
});
</script>
</body>
</html>
