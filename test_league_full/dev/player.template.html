<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07060c">
<title>My matches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/*__CSS__*/
main { max-width: 620px; margin: 0 auto; padding: 14px 14px 60px; }
.picker { display: flex; gap: 8px; margin-top: 14px; }
.picker input { flex: 1; }
.teamname { font-family: "Barlow Condensed", sans-serif; font-size: 40px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; line-height: 1; margin: 18px 0 4px; word-break: break-word; }
h2.sec { font-family: "Barlow Condensed", sans-serif; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-sub);
  margin: 20px 0 8px; display: flex; align-items: center; gap: 10px; }
h2.sec::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-hi), transparent); }
.big { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.big .t { font-size: 18px; font-weight: 600; word-break: break-word; }
.big .t.me { color: #fff; } .big .t.opp { color: var(--text-sub); }
.big .p { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 56px; line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.fact { flex: 1 1 120px; background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 10px; }
.fact .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-sub); }
.fact .v { font-family: "Barlow Condensed", sans-serif; font-size: 28px; font-weight: 700; margin-top: 2px; }
.res { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
.res:last-child { border-bottom: none; }
.wl { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 20px; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.wl.w { background: var(--cyan); } .wl.l { background: var(--magenta); }
.res .info { flex: 1; min-width: 0; } .res .info .o { font-weight: 600; } .res .info .s { font-size: 13px; color: var(--text-sub); }
table.st { width: 100%; border-collapse: collapse; }
table.st th { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-sub); text-align: center; padding: 0 4px 6px; }
table.st th:nth-child(2) { text-align: left; }
table.st td { padding: 9px 4px; text-align: center; border-top: 1px solid rgba(255,255,255,.06); font-variant-numeric: tabular-nums; }
table.st td:nth-child(2) { text-align: left; }
table.st tr.me td { background: var(--magenta-dim); font-weight: 700; }
table.st td.pts { font-family: "Barlow Condensed", sans-serif; font-size: 22px; font-weight: 700; }
.updated { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 24px; }
</style>
</head>
<body data-page="My matches">
<header class="brandbar">
  <img data-brand="logo" src="" alt="">
  <div><div class="brand-name" data-brand="name">League</div><div class="brand-sub" data-brand="sub"></div></div>
</header>
<main>
  <div class="picker">
    <input id="team-in" list="team-list" placeholder="Search your team…" autocomplete="off">
    <datalist id="team-list"></datalist>
    <button class="btn primary" id="btn-go">Show</button>
  </div>
  <div id="content"><div class="card" style="margin-top:16px">Pick your team to see your next match, live score and group standing.</div></div>
  <div class="updated" id="updated"></div>
</main>
<div class="toast" id="toast"></div>

<script>
// ===== CONFIGURE: your Apps Script web app URL (ends in /exec) =====
const APPS_SCRIPT_URL = "PASTE_YOUR_WEB_APP_URL_HERE";
// ==================================================================

/*__RULES__*/
/*__COMMON__*/

var P = { cfg: null, matches: [], standings: [], team: null };

function teamNames() {
  var set = {};
  P.standings.forEach(function (r) { if (r['Team Name']) set[r['Team Name']] = 1; });
  // knockout placeholders like "G1 1st" or "PQ1 Winner" are not teams, so only fall back to match names if there is no group table
  if (!P.standings.length) P.matches.forEach(function (m) { if (m['Team A']) set[m['Team A']] = 1; if (m['Team B']) set[m['Team B']] = 1; });
  return Object.keys(set).sort(function (a, b) { return a.localeCompare(b); });
}

function choose(name) {
  name = String(name || '').trim(); if (!name) return;
  var match = teamNames().filter(function (n) { return n.toLowerCase() === name.toLowerCase(); })[0];
  if (!match && P.matches.length) { toast('No team called "' + name + '"', true); return; }
  P.team = match || name; store('player_team', P.team);
  $('#team-in').value = P.team;
  var url = new URL(location.href); url.searchParams.set('team', P.team); history.replaceState(null, '', url);
  render();
}
$('#btn-go').onclick = function () { choose($('#team-in').value); };
$('#team-in').onkeydown = function (e) { if (e.key === 'Enter') choose(this.value); };
$('#team-in').onchange = function () { if (teamNames().indexOf(this.value) >= 0) choose(this.value); };

function mine(m) { var t = P.team.toLowerCase(); return String(m['Team A']).toLowerCase() === t || String(m['Team B']).toLowerCase() === t; }
function isA(m) { return String(m['Team A']).toLowerCase() === P.team.toLowerCase(); }

function render() {
  $('#team-list').innerHTML = teamNames().map(function (n) { return '<option value="' + esc(n) + '">'; }).join('');
  if (!P.team) return;
  var my = P.matches.filter(mine).sort(byQueue);
  var live = my.filter(function (m) { return m.Status === 'Live'; })[0];
  var next = my.filter(function (m) { return m.Status === 'Scheduled'; });
  var done = my.filter(function (m) { return m.Status === 'Done'; });
  var html = '<div class="teamname">' + esc(P.team) + '</div>';

  if (live) {
    var rule = P.cfg.stages[live.Stage], ms = Rules.matchStatus(rule, setsOf(live)), cs = setsOf(live)[ms.valid ? ms.currentSet : 0];
    var meA = isA(live), myPts = meA ? cs[0] : cs[1], opPts = meA ? cs[1] : cs[0];
    html += '<h2 class="sec"><span class="pill live"><span class="dot"></span>Live now</span></h2><div class="card">' +
      '<div class="big"><div class="t me">' + esc(P.team) + '</div><div class="p" style="color:var(--magenta)">' + myPts + '</div>' +
      '<div class="t opp">' + esc(meA ? live['Team B'] : live['Team A']) + '</div><div class="p" style="color:var(--cyan)">' + opPts + '</div></div>' +
      '<div class="facts"><div class="fact"><div class="k">Court</div><div class="v">' + esc(live.Court) + '</div></div>' +
      '<div class="fact"><div class="k">Stage</div><div class="v" style="font-size:20px">' + esc(live.Stage) + '</div></div>' +
      (rule.setsToWin > 1 && ms.valid ? '<div class="fact"><div class="k">Sets</div><div class="v">' + (meA ? ms.setsA + '–' + ms.setsB : ms.setsB + '–' + ms.setsA) + '</div></div>' : '') +
      '</div></div>';
  }

  html += '<h2 class="sec">Next match</h2>';
  if (next.length) {
    var n = next[0];
    var ahead = P.matches.filter(function (m) {
      return String(m.Court) === String(n.Court) && m['Match ID'] !== n['Match ID'] &&
        (m.Status === 'Live' || (m.Status === 'Scheduled' && byQueue(m, n) < 0));
    }).length;
    html += '<div class="card"><div class="muted" style="font-size:13px">' + esc(n.Stage) + (n.Group ? ' · Group ' + esc(n.Group) : '') + ' · ' + esc(n['Match ID']) + '</div>' +
      '<div style="font-size:22px;font-weight:700;margin-top:6px">vs ' + esc(isA(n) ? n['Team B'] : n['Team A']) + '</div>' +
      '<div class="facts"><div class="fact"><div class="k">Court</div><div class="v">' + esc(n.Court) + '</div></div>' +
      '<div class="fact"><div class="k">Matches ahead</div><div class="v">' + ahead + '</div></div></div>' +
      (ahead === 0 && !live ? '<div style="margin-top:10px;color:var(--ok);font-weight:600">You are up next — head to court ' + esc(n.Court) + '.</div>' : '') +
      (next.length > 1 ? '<div class="muted" style="margin-top:10px;font-size:13px">Later: ' + next.slice(1).map(function (m) { return 'vs ' + esc(isA(m) ? m['Team B'] : m['Team A']) + ' (court ' + esc(m.Court) + ')'; }).join(' · ') + '</div>' : '') +
      '</div>';
  } else html += '<div class="card muted">' + (live ? 'Nothing else scheduled yet.' : 'No upcoming match scheduled yet.') + '</div>';

  html += '<h2 class="sec">Results</h2><div class="card">';
  if (done.length) html += done.reverse().map(function (m) {
    var won = String(m.Winner).toLowerCase() === P.team.toLowerCase(), rule = P.cfg.stages[m.Stage];
    var sets = setsOf(m).filter(function (s, i) { return i === 0 || s[0] || s[1]; }).map(function (s) { return isA(m) ? s[0] + '–' + s[1] : s[1] + '–' + s[0]; });
    return '<div class="res"><div class="wl ' + (won ? 'w' : 'l') + '">' + (won ? 'W' : 'L') + '</div><div class="info"><div class="o">vs ' + esc(isA(m) ? m['Team B'] : m['Team A']) +
      '</div><div class="s">' + esc(m.Stage) + ' · ' + esc(sets.join(', ')) + '</div></div></div>';
  }).join('');
  else html += '<div class="muted">No completed matches yet.</div>';
  html += '</div>';

  var me = P.standings.filter(function (r) { return String(r['Team Name']).toLowerCase() === P.team.toLowerCase(); })[0];
  if (me) {
    var grp = P.standings.filter(function (r) { return r['Group Name'] === me['Group Name']; })
      .sort(function (a, b) { return (+b['Total Points'] || 0) - (+a['Total Points'] || 0); });
    var rank = grp.indexOf(me) + 1;
    html += '<h2 class="sec">Group ' + esc(me['Group Name']) + ' · you are #' + rank + '</h2><div class="card"><table class="st"><thead><tr><th></th><th>Team</th><th>MP</th><th>W</th><th>L</th><th>Pts</th></tr></thead><tbody>' +
      grp.map(function (r, i) {
        return '<tr class="' + (r === me ? 'me' : '') + '"><td>' + (i + 1) + '</td><td>' + esc(r['Team Name']) + '</td><td>' + esc(r['Total Matches']) + '</td><td>' + esc(r['Matches Won']) +
          '</td><td>' + esc(r['Matches Lost']) + '</td><td class="pts">' + esc(r['Total Points']) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  $('#content').innerHTML = html;
}

// One request per refresh. Each phone waits a little longer when the server is struggling (up to 1 minute),
// and phones are spread out in time so they don't all ask at the same second.
var failures = 0;
function refresh() {
  return Api.get({ view: 'public' }).then(function (r) {
    if (!r || !Array.isArray(r.matches)) throw new Error('bad');
    P.matches = r.matches; P.standings = r.standings || []; failures = 0;
    $('#updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    render();
  }).catch(function () { failures++; $('#updated').textContent = 'Busy — retrying…'; });
}
function schedule() {
  var base = (P.cfg.settings.PLAYER_POLL_MS) || 15000;
  var wait = Math.min(60000, base * Math.pow(2, Math.min(failures, 2))) * (0.8 + Math.random() * 0.4);
  setTimeout(function () { (document.hidden ? Promise.resolve() : refresh()).then(schedule); }, wait);
}
document.addEventListener('visibilitychange', function () { if (!document.hidden && P.cfg) refresh(); });

function boot() {
  loadConfig(connecting).then(function (cfg) {
    hideOffline();
    P.cfg = cfg;
    var q = new URLSearchParams(location.search).get('team');
    P.team = q || store('player_team');
    if (P.team) $('#team-in').value = P.team;
    return refresh().then(function () {
      if (P.team) choose(P.team);
      schedule();   // schedule() keeps retrying with backoff if refresh failed
    });
  }, function () { showOffline(boot); });
}
boot();
</script>
</body>
</html>
