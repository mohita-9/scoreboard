<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CXO Badminton League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* ── brand ── */
  --magenta:      #e7057e;
  --magenta-dim:  rgba(231,5,126,0.15);
  --magenta-glow: rgba(231,5,126,0.35);
  --cyan:         #00a2bb;
  --cyan-dim:     rgba(0,162,187,0.12);
  --cyan-glow:    rgba(0,162,187,0.35);

  /* ── backgrounds ── */
  --bg:           #0a0008;
  --bg-mid:       #060a10;
  --card:         rgba(8, 4, 12, 0.85);
  --card-hi:      rgba(6, 12, 20, 0.9);

  /* ── text ── */
  --text:         #f0f2f5;
  --text-sub:     #7a8494;
  --text-muted:   #3a4250;

  /* ── borders ── */
  --border:       rgba(0,162,187,0.12);
  --border-hi:    rgba(0,162,187,0.28);

  /* ── semantic ── */
  --win:          #00a2bb;   /* cyan = wins */
  --loss:         #e7057e;   /* magenta = losses */
  --pts:          #ffffff;
  --leader-pts:   #e7057e;
  --rank-1:       #e7057e;
  --rank-2:       #00a2bb;
  --rank-3:       rgba(0,162,187,0.55);
  --rank-4:       #3a4250;
}

body {
  background-color: #1a0030;
  background-image:
    /* bold magenta — left side, centre and bottom */
    radial-gradient(ellipse 90% 90% at -10% 70%,  #c4106e 0%, #8a0a50 35%, #3a0025 60%, transparent 80%),
    /* dark top-left corner — the only black zone */
    radial-gradient(ellipse 45% 45% at -5% -5%,   #0d000f 0%, transparent 50%),
    /* bold teal — floods the entire right half */
    radial-gradient(ellipse 90% 110% at 110% 50%, #00909f 0%, #007080 30%, #004a58 55%, transparent 80%),
    /* blending zone in the middle — deep purple mix */
    radial-gradient(ellipse 55% 70% at 48% 60%,  #2a0840 0%, transparent 65%);
  background-attachment: fixed;
  color: var(--text);
  font-family: "Inter", system-ui, sans-serif;
  min-height: 100vh;
  padding: 36px 40px 48px;
}

/* ── header ── */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 40px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.page-header .header-left {
  flex: 1;
  display: flex;
  align-items: center;
}
.page-header .header-center {
  flex: 0 0 auto;
  text-align: center;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}
.page-header .header-right {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: flex-end;
}
.page-header .logo-right {
  height: clamp(40px, 5vw, 72px);
  width: auto;
  object-fit: contain;
}
.page-header .logo-left {
  /* square logo — use height ~2.35x taller to visually match the wide right logo */
  height: clamp(90px, 11.5vw, 170px);
  width: auto;
  object-fit: contain;
}

.page-header h1 {
  font-family: "Barlow Condensed", sans-serif;
  font-size: clamp(32px, 5vw, 80px);
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  line-height: 1;
  background: linear-gradient(90deg, var(--magenta) 0%, #a030a0 40%, var(--cyan) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 24px var(--magenta-glow));
}

.page-header .sub {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-sub);
}

/* Decorative header underline */
.page-header::after {
  content: "";
  position: absolute;
  bottom: -1px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 2px;
  background: linear-gradient(90deg, var(--magenta), var(--cyan));
  border-radius: 2px;
}

.live-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-sub);
  background: var(--cyan-dim);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px 5px 8px;
}

.live-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan-glow);
  animation: blink 2s ease-in-out infinite;
}
.live-dot.error {
  background: var(--magenta);
  box-shadow: 0 0 8px var(--magenta-glow);
  animation: none;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

/* ── groups wrapper — fully responsive grid ── */
#groups {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
  gap: clamp(12px, 1.5vw, 24px);
  align-items: start;
}

/* ── card ── */
.group-card {
  background: rgba(5, 0, 10, 0.60);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-top-color: rgba(0,162,187,0.3);
  border-radius: 16px;
  padding: clamp(14px, 1.8vw, 24px);
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s;
  min-width: 0;
}

/* Cyan top-edge glow on each card */
.group-card::before {
  content: "";
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity: 0.6;
}

/* Subtle corner accent */
.group-card::after {
  content: "";
  position: absolute;
  top: 0; right: 0;
  width: 60px; height: 60px;
  background: radial-gradient(circle at top right, var(--magenta-dim), transparent 70%);
  border-radius: 0 16px 0 0;
}

.group-title-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.group-name {
  font-family: "Barlow Condensed", sans-serif;
  font-size: clamp(15px, 1.6vw, 26px);
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--cyan);
}

.group-rule {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--cyan-dim), transparent);
}

/* ── table ── */
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: auto;
}

thead th {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 0 0 9px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
thead th.th-rank { width: 28px; }
thead th.th-team { text-align: left; padding-left: 8px; width: 99%; }
thead th.th-num  { width: 42px; min-width: 42px; }
thead th.th-pts  { text-align: right; width: 54px; min-width: 54px; padding-right: 2px; }

tbody tr {
  border-bottom: 1px solid rgba(0,162,187,0.07);
  transition: background 0.15s;
}
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: rgba(0,162,187,0.04); }

/* leader row */
tbody tr.leader {
  background: rgba(231,5,126,0.05);
}
tbody tr.leader td:first-child {
  border-left: 3px solid var(--magenta);
  padding-left: 5px;
  box-shadow: inset 3px 0 8px rgba(231,5,126,0.15);
}

td {
  padding: 10px 6px;
  vertical-align: middle;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* rank */
td.td-rank {
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  padding: 10px 4px 10px 0;
  width: 28px;
  white-space: nowrap;
}
.r1 { color: var(--magenta); filter: drop-shadow(0 0 4px var(--magenta-glow)); }
.r2 { color: var(--cyan); }
.r3 { color: var(--rank-3); }
.r4 { color: var(--rank-4); }

/* team name */
td.td-team {
  font-size: clamp(12px, 1.2vw, 18px);
  font-weight: 500;
  color: var(--text);
  text-align: left;
  padding: 10px 12px 10px 8px;
}
tr.leader td.td-team {
  color: #ffffff;
  font-weight: 600;
}

/* numeric cols */
td.td-num {
  text-align: center;
  font-size: clamp(12px, 1.1vw, 16px);
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  width: 42px;
  min-width: 42px;
  white-space: nowrap;
  padding: 10px 0;
}
td.td-w { color: var(--win); }
td.td-l { color: var(--loss); }

/* points */
td.td-pts {
  text-align: right;
  padding: 10px 2px 10px 0;
  width: 54px;
  min-width: 54px;
  white-space: nowrap;
  font-family: "Barlow Condensed", sans-serif;
  font-size: clamp(18px, 2vw, 32px);
  font-weight: 700;
  color: var(--text-sub);
  font-variant-numeric: tabular-nums;
  transition: color 0.3s, text-shadow 0.3s;
}
td.td-pts.leader-pts {
  color: var(--magenta);
  text-shadow: 0 0 12px var(--magenta-glow);
}
td.td-pts.flash {
  color: #ffffff;
  text-shadow: 0 0 16px rgba(255,255,255,0.6);
}

@media (max-width: 600px) {
  body { padding: 18px 14px 32px; }
}
</style>

        points: Number(r["Total Points"]  || 0)
      };
    }).filter(function(r) { return r.group && r.team; });
  }

  function buildCard(groupName, list) {
    var card = document.createElement("div");
    card.className = "group-card";

    // Title
    var bar = document.createElement("div");
    bar.className = "group-title-bar";
    bar.innerHTML = "<span class='group-name'>" + groupName + "</span><span class='group-rule'></span>";
    card.appendChild(bar);

    // Table
    var table = document.createElement("table");
    table.innerHTML =
      "<thead><tr>" +
        "<th class='th-rank'></th>" +
        "<th class='th-team'>Team</th>" +
        "<th class='th-num'>P</th>" +
        "<th class='th-num'>W</th>" +
        "<th class='th-num'>L</th>" +
        "<th class='th-pts'>Pts</th>" +
      "</tr></thead>";

    var tbody = document.createElement("tbody");
    var flashEls = [];

    list.forEach(function(r, idx) {
      var key = groupName + "|" + r.team;
      var changed = prevPoints[key] !== undefined && prevPoints[key] !== r.points;
      prevPoints[key] = r.points;

      var isLeader = idx === 0;
      var rankCls  = ["r1","r2","r3","r4"][Math.min(idx, 3)];
      var ptsCls   = "td-pts" + (isLeader ? " leader-pts" : "") + (changed ? " flash" : "");

      var tr = document.createElement("tr");
      if (isLeader) tr.classList.add("leader");

      tr.innerHTML =
        "<td class='td-rank " + rankCls + "'>" + (idx + 1) + "</td>" +
        "<td class='td-team'>" + r.team + "</td>" +
        "<td class='td-num'>" + r.played + "</td>" +
        "<td class='td-num td-w'>" + r.won + "</td>" +
        "<td class='td-num td-l'>" + r.lost + "</td>" +
        "<td class='" + ptsCls + "'>" + r.points + "</td>";

      tbody.appendChild(tr);
      if (changed) flashEls.push(tr.querySelector(".flash"));
    });

    if (flashEls.length) {
      setTimeout(function() {
        flashEls.forEach(function(el) { if (el) el.classList.remove("flash"); });
      }, 1500);
    }

    table.appendChild(tbody);
    card.appendChild(table);
    return card;
  }

  function render(rows) {
    var groups = {};
    rows.forEach(function(r) {
      if (!groups[r.group]) groups[r.group] = [];
      groups[r.group].push(r);
    });

    var container = document.getElementById("groups");
    container.innerHTML = "";

    var names = Object.keys(groups).sort();

    names.forEach(function(name) {
      var list = groups[name].slice().sort(function(a, b) { return b.points - a.points; });
      container.appendChild(buildCard(name, list));
    });

    requestAnimationFrame(function() {});
  }

  async function refresh() {
    var dot  = document.getElementById("live-dot");
    var text = document.getElementById("status-text");
    try {
      var url = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.includes("?") ? "&" : "?") + "t=" + Date.now();
      var res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var data = await res.json();
      var rows = parseJson(data);
      if (!rows.length) throw new Error("empty");
      lastGoodRows = rows;
      render(rows);
      dot.classList.remove("error");
      text.style.color = "";
      text.textContent = "updated " + new Date().toLocaleTimeString();
    } catch(err) {
      dot.classList.add("error");
      text.style.color = "#f16060";
      text.textContent = "retrying…";
      // Keep last good data on screen — don't blank the board
      if (lastGoodRows.length) render(lastGoodRows);
      console.error(err);
    }
  }

  refresh();
  setInterval(refresh, POLL_MS);
</script>
</body>
</html>
