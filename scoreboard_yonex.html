<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CXO Baddy League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* ── brand ── */
  --magenta:      #dd0e23;
  --magenta-dim:  rgba(221,14,35,0.15);
  --magenta-glow: rgba(221,14,35,0.35);
  --cyan:         #0b49d3;
  --cyan-dim:     rgba(11,73,211,0.12);
  --cyan-glow:    rgba(11,73,211,0.35);

  /* ── backgrounds ── */
  --bg:           #0a0008;
  --bg-mid:       #060a10;
  --card:         rgba(8, 4, 12, 0.85);
  --card-hi:      rgba(6, 12, 20, 0.9);

  /* ── text ── */
  --text:         #f0f2f5;
  --text-sub:     #7a8494;
  --text-muted:   #3a4250;

  /* ── borders ── */
  --border:       rgba(11,73,211,0.12);
  --border-hi:    rgba(11,73,211,0.28);

  /* ── semantic ── */
  --win:          #0b49d3;   /* cyan = wins */
  --loss:         #dd0e23;   /* magenta = losses */
  --pts:          #ffffff;
  --leader-pts:   #dd0e23;
  --rank-1:       #dd0e23;
  --rank-2:       #0b49d3;
  --rank-3:       rgba(11,73,211,0.55);
  --rank-4:       #3a4250;
}

body {
  background-color: #07060c;
  background-image:
    radial-gradient(ellipse 80% 80% at -5% 100%, rgba(221,14,35,0.45) 0%, rgba(221,14,35,0.15) 40%, transparent 65%),
    radial-gradient(ellipse 70% 90% at 105% 50%, rgba(11,73,211,0.40) 0%, rgba(11,73,211,0.12) 45%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 50% 50%,  rgba(30,10,50,0.5) 0%, transparent 80%);
}

/* ── header ── */
.page-header {
  padding-top: clamp(12px, 2vw, 28px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 40px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.page-header .header-left {
  flex: 1;
  display: flex;
  align-items: center;
}
.page-header .title-logo { height: clamp(60px, 11vw, 110px); max-width: 100%; width: auto; object-fit: contain; display: block; margin: 0 auto 0; }
.header-center { display: inline-flex; flex-direction: column; align-items: center; flex: 0 0 auto; }

.page-header .header-right {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: flex-end;
}
.page-header .logo-right { height: clamp(40px, 5.5vw, 68px); width: auto; object-fit: contain; }
.page-header .logo-left  { height: clamp(40px, 5.5vw, 68px); width: auto; object-fit: contain; }
.logo-center { height: clamp(64px, 12vw, 120px); width: auto; object-fit: contain; max-width: 320px; }

.page-header h1 {
  font-family: "Barlow Condensed", sans-serif;
  font-size: clamp(32px, 5vw, 80px);
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  line-height: 1;
  background: linear-gradient(90deg, var(--magenta) 0%, #a030a0 40%, var(--cyan) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 24px var(--magenta-glow));
}

.page-header .sub {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-sub);
}

/* Decorative header underline */
.page-header::after {
  content: "";
  position: absolute;
  bottom: -1px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 2px;
  background: linear-gradient(90deg, var(--magenta), var(--cyan));
  border-radius: 2px;
}

.live-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-sub);
  background: var(--cyan-dim);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px 5px 8px;
}

.live-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan-glow);
  animation: blink 2s ease-in-out infinite;
}
.live-dot.error {
  background: var(--magenta);
  box-shadow: 0 0 8px var(--magenta-glow);
  animation: none;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

/* ── groups wrapper — slideshow ── */
#groups {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
  gap: clamp(12px, 1.5vw, 24px);
  align-items: start;
  transition: opacity 0.4s ease;
}
#groups.fade-out { opacity: 0; }
#groups.fade-in  { opacity: 1; }

/* slide nav */
.slide-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-top: 24px;
}
.slide-dots { display: flex; gap: 8px; align-items: center; }
.slide-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-muted);
  cursor: pointer; transition: all 0.3s;
}
.slide-dot.active {
  background: var(--magenta);
  box-shadow: 0 0 8px var(--magenta-glow);
  transform: scale(1.3);
}
.slide-dot:hover { background: var(--cyan); }
.slide-counter {
  font-size: 12px; font-weight: 500;
  letter-spacing: 0.1em; color: var(--text-muted);
}
.slide-progress {
  width: 100%; height: 2px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px; margin-top: 12px; overflow: hidden;
}
.slide-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--magenta), var(--cyan));
  border-radius: 2px;
  width: 0%;
}

/* ── card ── */
.group-card {
  background: rgba(5, 0, 10, 0.60);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-top-color: rgba(11,73,211,0.3);
  border-radius: 16px;
  padding: clamp(14px, 1.8vw, 24px);
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s;
  min-width: 0;
}

/* Cyan top-edge glow on each card */
.group-card::before {
  content: "";
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity: 0.6;
}

/* Subtle corner accent */
.group-card::after {
  content: "";
  position: absolute;
  top: 0; right: 0;
  width: 60px; height: 60px;
  
  border-radius: 0 16px 0 0;
}

.group-title-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.group-name {
  font-family: "Barlow Condensed", sans-serif;
  font-size: clamp(15px, 1.6vw, 26px);
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--cyan);
}

.group-rule {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--cyan-dim), transparent);
}

/* ── table ── */
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: auto;
  width: 100%;
}

thead th {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #b0b8c4;
  padding: 0 0 6px;
  text-align: center;
  border-bottom: none;
  white-space: nowrap;
  overflow: hidden;
}
thead tr {
  border-bottom: none;
}
thead th.th-rank { width: 28px; }
thead th.th-team { text-align: left; padding-left: 8px; }
thead th.th-num  { width: 48px; white-space: nowrap; }
thead th.th-pts  { text-align: right; width: 56px; white-space: nowrap; padding-right: 4px; }

tbody tr {
  border-bottom: 1px solid rgba(11,73,211,0.07);
  transition: background 0.15s;
}
tbody tr:first-child {
  border-top: none;
}
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: rgba(11,73,211,0.04); }

/* leader row */
tbody tr.leader {
  background: rgba(221,14,35,0.05);
}
tbody tr.leader td:first-child {
  border-left: 3px solid var(--magenta);
  padding-left: 5px;
  box-shadow: inset 3px 0 8px rgba(221,14,35,0.15);
}
tbody tr:first-child td {
  border-top: none;
}

td {
  padding: 10px 4px;
  vertical-align: middle;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* rank */
td.td-rank {
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  padding: 10px 4px 10px 0;
  width: 28px;
  white-space: nowrap;
}
.r1 { color: var(--magenta); filter: drop-shadow(0 0 4px var(--magenta-glow)); }
.r2 { color: var(--cyan); }
.r3 { color: var(--rank-3); }
.r4 { color: var(--rank-4); }

/* team name */
td.td-team {
  font-size: clamp(12px, 1.2vw, 18px);
  font-weight: 500;
  color: var(--text);
  text-align: left;
  padding: 10px 12px 10px 8px;
}
tr.leader td.td-team {
  color: #ffffff;
  font-weight: 600;
}

/* numeric cols */
td.td-num {
  text-align: center;
  font-size: clamp(12px, 1.1vw, 16px);
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  width: 44px;
  white-space: nowrap;
  padding: 10px 0;
}
td.td-w { color: var(--win); }
td.td-l { color: var(--loss); }

/* points */
td.td-pts {
  text-align: right;
  padding: 10px 4px 10px 0;
  width: 52px;
  white-space: nowrap;
  font-family: "Barlow Condensed", sans-serif;
  font-size: clamp(18px, 2vw, 32px);
  font-weight: 700;
  color: var(--text-sub);
  font-variant-numeric: tabular-nums;
  transition: color 0.3s, text-shadow 0.3s;
}
td.td-pts.leader-pts {
  color: var(--magenta);
  text-shadow: 0 0 12px var(--magenta-glow);
}
td.td-pts.flash {
  color: #ffffff;
  text-shadow: 0 0 16px rgba(255,255,255,0.6);
}

@media (max-width: 600px) {
  .title-logo { height: clamp(60px, 11vw, 110px); max-width: 100%; width: auto; object-fit: contain; display: block; margin: 0 auto 0; }
  body { padding: 18px 14px 32px; }
}



@media (max-width: 600px) {
  .title-logo { height: clamp(60px, 11vw, 110px); max-width: 100%; width: auto; object-fit: contain; display: block; margin: 0 auto 0; }
  .page-header {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 8px;
  }
  .title-logo { height: clamp(60px, 11vw, 110px); max-width: 100%; width: auto; object-fit: contain; display: block; margin: 0 auto 0; }
.header-center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; flex: 1; gap: 0; }
  .logo-center { height: clamp(64px, 12vw, 120px); width: auto; object-fit: contain; max-width: 320px; }
  .logo-left, .logo-right { height: clamp(36px, 5.5vw, 68px); }
  .header-left  { justify-content: flex-start; }
  .header-right { justify-content: flex-end; }
}


/* ── header layout override: big centred logo, side logos aligned to its middle ── */
.page-header {
  display: grid !important;
  grid-template-columns: 1fr auto 1fr !important;
  grid-template-rows: auto !important;
  align-items: center !important;
  padding-bottom: 44px !important;
}
.page-header .header-left  { justify-self: start; display: flex; align-items: center; }
.page-header .header-right { justify-self: end;   display: flex; align-items: center; }
.header-center { position: relative; display: flex; justify-content: center; }
.logo-center { height: clamp(90px, 14vw, 170px) !important; max-width: 46vw !important; width: auto; }
.header-center .live-pill {
  position: absolute; top: calc(100% + 6px); left: 50%; right: auto; transform: translateX(-50%); margin: 0 !important; white-space: nowrap;
}
@media (max-width: 600px) {
  .page-header { grid-template-columns: 1fr auto 1fr !important; gap: 8px !important; }
  .logo-center { height: clamp(70px, 20vw, 110px) !important; max-width: 48vw !important; }
  .page-header .logo-left, .page-header .logo-right { height: clamp(24px, 7vw, 40px) !important; }
}
</style>
</head>

<div id="groups"></div>

<div class="slide-nav">
  <span class="slide-counter" id="slide-counter">1 / 1</span>
  <div class="slide-dots" id="slide-dots"></div>
</div>
<div class="slide-progress">
  <div class="slide-progress-bar" id="progress-bar"></div>
</div>

<script>
  // ===== CONFIGURE =====
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_54_l9Ra3EVcKLt3sA4iCeVqHR9767yhS_60L7El_9qk46nPYAg-j3M_of7NTfKAH/exec?sheet=Sheet1";
  const POLL_MS = 8000;
  // =====================

  const prevPoints = {};
  let lastGoodRows = [];
  let allGroupNames = [];
  let allGroupData  = {};
  let slideIndex    = 0;
  let slideTimer    = null;
  const GROUPS_PER_SLIDE = 2;
  const SLIDE_MS = 8000;

  function parseJson(data) {
    return data.map(function(r) {
      return {
        group:  String(r["Group Name"]    || "").trim(),
        team:   String(r["Team Name"]     || "").trim(),
        played: Number(r["Total Matches"] || 0),
        won:    Number(r["Matches Won"]   || 0),
        lost:   Number(r["Matches Lost"]  || 0),
        points: Number(r["Total Points"]  || 0)
      };
    }).filter(function(r) { return r.group && r.team; });
  }

  function buildCard(groupName, list) {
    var card = document.createElement("div");
    card.className = "group-card";

    var bar = document.createElement("div");
    bar.className = "group-title-bar";
    bar.innerHTML = "<span class='group-name'>" + groupName + "</span><span class='group-rule'></span>";
    card.appendChild(bar);

    var table = document.createElement("table");
    table.innerHTML =
      "<thead><tr>" +
        "<th class='th-rank'></th>" +
        "<th class='th-team'>Team</th>" +
        "<th class='th-num'>MP</th>" +
        "<th class='th-num'>W</th>" +
        "<th class='th-num'>L</th>" +
        "<th class='th-pts'>Pts</th>" +
      "</tr></thead>";

    var tbody = document.createElement("tbody");
    var flashEls = [];

    list.forEach(function(r, idx) {
      var key = groupName + "|" + r.team;
      var changed = prevPoints[key] !== undefined && prevPoints[key] !== r.points;
      prevPoints[key] = r.points;

      var isLeader = idx === 0;
      var rankCls  = ["r1","r2","r3","r4"][Math.min(idx, 3)];
      var ptsCls   = "td-pts" + (isLeader ? " leader-pts" : "") + (changed ? " flash" : "");

      var tr = document.createElement("tr");
      if (isLeader) tr.classList.add("leader");

      tr.innerHTML =
        "<td class='td-rank " + rankCls + "'>" + (idx + 1) + "</td>" +
        "<td class='td-team'>" + r.team + "</td>" +
        "<td class='td-num'>" + r.played + "</td>" +
        "<td class='td-num td-w'>" + r.won + "</td>" +
        "<td class='td-num td-l'>" + r.lost + "</td>" +
        "<td class='" + ptsCls + "'>" + r.points + "</td>";

      tbody.appendChild(tr);
      if (changed) flashEls.push(tr.querySelector(".flash"));
    });

    if (flashEls.length) {
      setTimeout(function() {
        flashEls.forEach(function(el) { if (el) el.classList.remove("flash"); });
      }, 1500);
    }

    table.appendChild(tbody);
    card.appendChild(table);
    return card;
  }

  function totalSlides() {
    return Math.ceil(allGroupNames.length / GROUPS_PER_SLIDE);
  }

  function updateDots() {
    var dotsEl = document.getElementById("slide-dots");
    if (!dotsEl) return;
    var total = totalSlides();
    dotsEl.innerHTML = "";
    for (var i = 0; i < total; i++) {
      var dot = document.createElement("span");
      dot.className = "slide-dot" + (i === slideIndex ? " active" : "");
      (function(idx) {
        dot.addEventListener("click", function() { goToSlide(idx); });
      })(i);
      dotsEl.appendChild(dot);
    }
  }

  function showSlide(idx, animate) {
    var container = document.getElementById("groups");
    var names = allGroupNames.slice(idx * GROUPS_PER_SLIDE, idx * GROUPS_PER_SLIDE + GROUPS_PER_SLIDE);

    if (animate) {
      container.classList.add("fade-out");
      setTimeout(function() {
        renderSlideContent(container, names);
        container.classList.remove("fade-out");
        container.classList.add("fade-in");
        setTimeout(function() { container.classList.remove("fade-in"); }, 500);
      }, 400);
    } else {
      renderSlideContent(container, names);
    }

    updateDots();

    // Update slide counter
    var counter = document.getElementById("slide-counter");
    if (counter) counter.textContent = (idx + 1) + " / " + totalSlides();
  }

  function renderSlideContent(container, names) {
    container.innerHTML = "";
    names.forEach(function(name) {
      var list = allGroupData[name].slice().sort(function(a, b) { return b.points - a.points; });
      container.appendChild(buildCard(name, list));
    });
  }

  function goToSlide(idx) {
    slideIndex = idx;
    showSlide(slideIndex, true);
    resetTimer();
  }

  function nextSlide() {
    slideIndex = (slideIndex + 1) % totalSlides();
    showSlide(slideIndex, true);
  }

  function resetTimer() {
    if (slideTimer) clearInterval(slideTimer);
    // Animate progress bar
    var bar = document.getElementById("progress-bar");
    if (bar) {
      bar.style.transition = "none";
      bar.style.width = "0%";
      setTimeout(function() {
        bar.style.transition = "width " + SLIDE_MS + "ms linear";
        bar.style.width = "100%";
      }, 50);
    }
    slideTimer = setInterval(function() {
      nextSlide();
      // Reset progress bar
      if (bar) {
        bar.style.transition = "none";
        bar.style.width = "0%";
        setTimeout(function() {
          bar.style.transition = "width " + SLIDE_MS + "ms linear";
          bar.style.width = "100%";
        }, 50);
      }
    }, SLIDE_MS);
  }

  function render(rows) {
    var groups = {};
    rows.forEach(function(r) {
      if (!groups[r.group]) groups[r.group] = [];
      groups[r.group].push(r);
    });

    allGroupData  = groups;
    allGroupNames = Object.keys(groups).sort();

    // Keep slideIndex in bounds if groups changed
    if (slideIndex >= totalSlides()) slideIndex = 0;

    showSlide(slideIndex, false);

    // Start/restart timer only once
    if (!slideTimer) resetTimer();
  }

  async function refresh() {
    var dot  = document.getElementById("live-dot");
    var text = document.getElementById("status-text");
    try {
      var url = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.includes("?") ? "&" : "?") + "t=" + Date.now();
      var res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var data = await res.json();
      var rows = parseJson(data);
      if (!rows.length) throw new Error("empty");
      lastGoodRows = rows;
      render(rows);
      dot.classList.remove("error");
      text.style.color = "";
      text.textContent = "updated " + new Date().toLocaleTimeString();
    } catch(err) {
      dot.classList.add("error");
      text.style.color = "#f16060";
      text.textContent = "retrying…";
      if (lastGoodRows.length) render(lastGoodRows);
      console.error(err);
    }
  }

  refresh();
  setInterval(refresh, POLL_MS);
</script>

  new QRCode(document.getElementById("qr-code"), {

    height: 110,
    colorDark: "#ffffff",
    colorLight: "rgba(0,0,0,0)",
    correctLevel: QRCode.CorrectLevel.H
  });
