<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CXO Pickleball League — Knockouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --magenta:      #e7057e;
  --magenta-dim:  rgba(231,5,126,0.15);
  --magenta-glow: rgba(231,5,126,0.35);
  --cyan:         #00a2bb;
  --cyan-dim:     rgba(0,162,187,0.12);
  --cyan-glow:    rgba(0,162,187,0.35);
  --text:         #f0f2f5;
  --text-sub:     #7a8494;
  --text-muted:   #3a4250;
  --border:       rgba(0,162,187,0.12);
}
body {
  background-color: #1a0030;
  background-image:
    radial-gradient(ellipse 90% 90% at -10% 70%,  #c4106e 0%, #8a0a50 35%, #3a0025 60%, transparent 80%),
    radial-gradient(ellipse 45% 45% at -5% -5%,   #0d000f 0%, transparent 50%),
    radial-gradient(ellipse 90% 110% at 110% 50%, #00909f 0%, #007080 30%, #004a58 55%, transparent 80%),
    radial-gradient(ellipse 55% 70% at 48% 60%,  #2a0840 0%, transparent 65%);
  background-attachment: fixed;
  color: var(--text);
  font-family: "Inter", system-ui, sans-serif;
  min-height: 100vh;
  padding: 32px 40px 48px;
}
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 40px; padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.header-left { flex: 1; display: flex; align-items: center; }
.header-center {
  flex: 0 0 auto; text-align: center;
  position: absolute; left: 50%; transform: translateX(-50%);
}
.header-right { flex: 1; display: flex; align-items: center; justify-content: flex-end; }
.logo-right { height: clamp(40px, 5vw, 72px); width: auto; object-fit: contain; }
.logo-left  { height: clamp(80px, 10vw, 140px); width: auto; object-fit: contain; }
h1 {
  font-family: "Barlow Condensed", sans-serif;
  font-size: clamp(28px, 4vw, 60px); font-weight: 700;
  letter-spacing: 0.04em; text-transform: uppercase; line-height: 1;
  background: linear-gradient(90deg, var(--magenta) 0%, #a030a0 40%, var(--cyan) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  filter: drop-shadow(0 0 24px var(--magenta-glow));
}
.sub { font-size: 11px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-sub); margin-top: 6px; }
.header-center::after {
  content: ""; display: block; margin: 10px auto 0;
  width: 80px; height: 2px;
  background: linear-gradient(90deg, var(--magenta), var(--cyan)); border-radius: 2px;
}
.live-pill {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-sub); background: var(--cyan-dim);
  border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px 5px 8px; margin-top: 10px;
}
.live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--cyan); box-shadow: 0 0 8px var(--cyan-glow);
  animation: blink 2s ease-in-out infinite;
}
.live-dot.error { background: var(--magenta); box-shadow: 0 0 8px var(--magenta-glow); animation: none; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
.stages { display: flex; flex-direction: column; gap: 36px; }
.stage-title {
  font-family: "Barlow Condensed", sans-serif;
  font-size: clamp(18px, 2.5vw, 32px); font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  margin-bottom: 16px; display: flex; align-items: center; gap: 14px;
}
.stage-pill {
  font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
  padding: 3px 12px; border-radius: 20px; text-transform: uppercase;
}
.qf-title { color: var(--cyan); }
.qf-pill  { background: var(--cyan-dim); border: 1px solid var(--cyan); color: var(--cyan); }
.sf-title { color: var(--magenta); }
.sf-pill  { background: var(--magenta-dim); border: 1px solid var(--magenta); color: var(--magenta); }
.fi-title {
  background: linear-gradient(90deg, var(--magenta), var(--cyan));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  filter: drop-shadow(0 0 12px var(--magenta-glow));
}
.fi-pill { background: linear-gradient(90deg, var(--magenta), var(--cyan)); color: #fff; border: none; }
.matches-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  gap: 16px;
}
.match-card {
  background: rgba(5,0,10,0.60); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08); border-top-color: rgba(0,162,187,0.25);
  border-radius: 14px; overflow: hidden; position: relative;
}
.match-card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
}
.match-card.status-live::before {
  background: linear-gradient(90deg, var(--magenta), var(--cyan));
  box-shadow: 0 0 12px var(--magenta-glow);
  animation: stripe 2s ease-in-out infinite;
}
.match-card.status-done::before     { background: var(--cyan); }
.match-card.status-upcoming::before { background: var(--text-muted); }
@keyframes stripe { 0%,100%{opacity:1} 50%{opacity:0.3} }
.match-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px 8px; border-bottom: 1px solid rgba(255,255,255,0.05);
}
.match-num { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
.match-status { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; }
.status-live .match-status     { background: var(--magenta-dim); color: var(--magenta); border: 1px solid var(--magenta); animation: blink 1.5s ease-in-out infinite; }
.status-done .match-status     { background: var(--cyan-dim); color: var(--cyan); border: 1px solid var(--cyan); }
.status-upcoming .match-status { background: rgba(255,255,255,0.04); color: var(--text-muted); border: 1px solid var(--text-muted); }
.match-body { padding: 14px 16px 16px; }
.team-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.04); position: relative;
}
.team-row:last-child { border-bottom: none; }
.team-name { font-size: clamp(14px, 1.4vw, 20px); font-weight: 500; color: var(--text); flex: 1; }
.team-name.winner { font-weight: 700; color: #fff; }
.winner-badge { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--magenta); margin-left: 8px; white-space: nowrap; }
.team-score {
  font-family: "Barlow Condensed", sans-serif;
  font-size: clamp(26px, 3vw, 44px); font-weight: 700;
  font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; color: var(--text-sub);
}
.team-score.winner-score { color: var(--magenta); text-shadow: 0 0 12px var(--magenta-glow); }
.team-score.loser-score  { color: var(--text-muted); }
.vs-divider { text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 0.15em; color: var(--text-muted); padding: 2px 0; }
.tbd { color: var(--text-muted); font-style: italic; font-size: 13px; }
.final-card { border-color: rgba(231,5,126,0.3); box-shadow: 0 0 32px rgba(231,5,126,0.1), 0 0 64px rgba(0,162,187,0.05); }
.champion-banner {
  position: relative;
  background: linear-gradient(135deg, rgba(231,5,126,0.2), rgba(0,162,187,0.2));
  border: 2px solid var(--magenta);
  border-radius: 14px;
  padding: 14px 24px;
  text-align: center;
  margin-bottom: 8px;
  overflow: hidden;
  animation: champion-pulse 2s ease-in-out infinite;
  box-shadow:
    0 0 30px rgba(231,5,126,0.4),
    0 0 60px rgba(231,5,126,0.2),
    0 0 100px rgba(0,162,187,0.15),
    inset 0 0 40px rgba(231,5,126,0.05);
}
/* sweeping light beam */
.champion-banner::before {
  content: "";
  position: absolute;
  top: 0; left: -100%; width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
  animation: sweep 3s ease-in-out infinite;
}
/* bottom glow bar */
.champion-banner::after {
  content: "";
  position: absolute;
  bottom: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--magenta), var(--cyan), var(--magenta));
  background-size: 200% 100%;
  animation: shimmer 2s linear infinite;
}
@keyframes champion-pulse {
  0%,100% { box-shadow: 0 0 30px rgba(231,5,126,0.4), 0 0 60px rgba(231,5,126,0.2), 0 0 100px rgba(0,162,187,0.15); border-color: var(--magenta); }
  50%      { box-shadow: 0 0 50px rgba(231,5,126,0.7), 0 0 100px rgba(231,5,126,0.35), 0 0 150px rgba(0,162,187,0.25); border-color: var(--cyan); }
}
@keyframes sweep {
  0%   { left: -100%; }
  100% { left: 200%; }
}
@keyframes shimmer {
  0%   { background-position: 0% 0%; }
  100% { background-position: 200% 0%; }
}
.champion-label {
  font-family: "Barlow Condensed", sans-serif;
  font-size: clamp(20px, 2.5vw, 36px);
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--cyan);
  margin-bottom: 6px;
  text-shadow: 0 0 20px var(--cyan-glow);
  animation: label-blink 1.2s ease-in-out infinite;
}
@keyframes label-blink {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.5; }
}
.champion-name {
  font-family: "Barlow Condensed", sans-serif;
  font-size: clamp(36px, 5.5vw, 72px);
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  line-height: 1;
  background: linear-gradient(90deg, var(--magenta), #ff60c0, var(--cyan), var(--magenta));
  background-size: 300% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: name-shimmer 3s linear infinite, name-scale 2s ease-in-out infinite;
  display: inline-block;
}
@keyframes name-shimmer {
  0%   { background-position: 0% 0%; }
  100% { background-position: 300% 0%; }
}
@keyframes name-scale {
  0%,100% { transform: scale(1); filter: drop-shadow(0 0 16px var(--magenta-glow)); }
  50%      { transform: scale(1.04); filter: drop-shadow(0 0 32px rgba(231,5,126,0.9)) drop-shadow(0 0 48px rgba(0,162,187,0.5)); }
}
.champion-trophy {
  font-size: clamp(26px, 3.2vw, 42px);
  display: block;
  margin-bottom: 0px;
  animation: trophy-bounce 1s ease-in-out infinite;
}
@keyframes trophy-bounce {
  0%,100% { transform: translateY(0) rotate(-5deg); }
  50%      { transform: translateY(-8px) rotate(5deg); }
}
.empty-state { text-align: center; color: var(--text-muted); font-size: 14px; padding: 40px; letter-spacing: 0.06em; }
@media (max-width: 600px) { body { padding: 18px 14px 32px; } }
</style>
</head>

<div class="stages" id="stages">
  <div class="empty-state">Loading matches…</div>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_54_l9Ra3EVcKLt3sA4iCeVqHR9767yhS_60L7El_9qk46nPYAg-j3M_of7NTfKAH/exec?sheet=Knockout";
  const POLL_MS = 8000;
  let lastGoodData = null;

  function statusClass(s) {
    s = (s || "").toLowerCase().trim();
    if (s === "live") return "live";
    if (s === "done") return "done";
    return "upcoming";
  }

  function renderMatch(match, isFinal) {
    var status  = statusClass(match.Status);
    var teamA   = (match["Team A"] || "TBD").trim();
    var teamB   = (match["Team B"] || "TBD").trim();
    var scoreA  = match["Score A"];
    var scoreB  = match["Score B"];
    var winner  = (match["Winner"] || "").trim();
    var matchNo = match["Match No"] || "";
    var isWinA  = winner && winner === teamA;
    var isWinB  = winner && winner === teamB;
    var showSc  = status !== "upcoming";
    var statusTxt = status === "live" ? "● Live" : status === "done" ? "Completed" : "Upcoming";

    var card = document.createElement("div");
    card.className = "match-card status-" + status + (isFinal ? " final-card" : "");
    card.innerHTML =
      "<div class='match-header'>" +
        "<span class='match-num'>Match " + matchNo + "</span>" +
        "<span class='match-status'>" + statusTxt + "</span>" +
      "</div>" +
      "<div class='match-body'>" +
        "<div class='team-row'>" +
          "<span class='team-name" + (isWinA ? " winner" : "") + "'>" +
            (teamA === "TBD" ? "<span class='tbd'>TBD</span>" : teamA) +
            (isWinA ? "<span class='winner-badge'>✦ Winner</span>" : "") +
          "</span>" +
          (showSc ? "<span class='team-score" + (isWinA ? " winner-score" : status==="done" ? " loser-score" : "") + "'>" + scoreA + "</span>" : "") +
        "</div>" +
        "<div class='vs-divider'>VS</div>" +
        "<div class='team-row'>" +
          "<span class='team-name" + (isWinB ? " winner" : "") + "'>" +
            (teamB === "TBD" ? "<span class='tbd'>TBD</span>" : teamB) +
            (isWinB ? "<span class='winner-badge'>✦ Winner</span>" : "") +
          "</span>" +
          (showSc ? "<span class='team-score" + (isWinB ? " winner-score" : status==="done" ? " loser-score" : "") + "'>" + scoreB + "</span>" : "") +
        "</div>" +
      "</div>";
    return card;
  }

  function render(rows) {
    var stages = {};
    var stageOrder = {};
    rows.forEach(function(r) {
      var s = (r["Stage"] || "Other").trim();
      var o = parseInt(r["Order"]) || 99;
      if (!stages[s]) { stages[s] = []; stageOrder[s] = o; }
      stages[s].push(r);
    });

    var container = document.getElementById("stages");
    container.innerHTML = "";
    var champion = "";

    // Check for champion first so we can render banner at top
    Object.keys(stages).forEach(function(stageName) {
      stages[stageName].forEach(function(m) {
        if ((stageName === "Final" || stageOrder[stageName] === Math.max.apply(null, Object.values(stageOrder))) && m.Winner) {
          champion = m.Winner.trim();
        }
      });
    });

    // Render champion banner at TOP if exists
    if (champion) {
      var banner = document.createElement("div");
      banner.className = "champion-banner";
      banner.innerHTML =
        "<span class='champion-trophy'>🏆</span>" +
        "<div class='champion-label'>⚡ Champion ⚡</div>" +
        "<div class='champion-name'>" + champion + "</div>";
      container.appendChild(banner);
    }

    Object.keys(stages)
      .sort(function(a,b) { return stageOrder[a] - stageOrder[b]; })
      .forEach(function(stageName) {
        var matches = stages[stageName];
        var isFinal = stageName === "Final";
        var isSF    = stageName === "Semi Final";
        var titleCls = isFinal ? "fi-title" : isSF ? "sf-title" : "qf-title";
        var pillCls  = isFinal ? "fi-pill"  : isSF ? "sf-pill"  : "qf-pill";

        var block = document.createElement("div");
        block.className = "stage-block";
        block.innerHTML =
          "<div class='stage-title'>" +
            "<span class='" + titleCls + "'>" + stageName + "</span>" +
            "<span class='stage-pill " + pillCls + "'>" + stageName + "</span>" +
          "</div>" +
          "<div class='matches-grid'></div>";

        var grid = block.querySelector(".matches-grid");
        matches.forEach(function(m) {
          grid.appendChild(renderMatch(m, isFinal));
          if (isFinal && m.Winner) champion = m.Winner.trim();
        });

        container.appendChild(block);
      });
  }

  async function refresh() {
    var dot  = document.getElementById("live-dot");
    var text = document.getElementById("status-text");
    try {
      var url = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.includes("?") ? "&" : "?") + "t=" + Date.now();
      var res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var data = await res.json();
      if (!data.length) throw new Error("empty");
      lastGoodData = data;
      render(data);
      dot.classList.remove("error");
      text.style.color = "";
      text.textContent = "updated " + new Date().toLocaleTimeString();
    } catch(err) {
      dot.classList.add("error");
      text.style.color = "#f16060";
      text.textContent = "retrying…";
      if (lastGoodData) render(lastGoodData);
      console.error(err);
    }
  }

  refresh();
  setInterval(refresh, POLL_MS);
</script>
</body>
</html>
